[project]
name = "socratic-hybrid-canvas"
version = "0.1.0"
description = "Local visual prototype of the Socratic Hybrid Canvas — dual-layered interactive lesson viewer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "openai>=2.46.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
