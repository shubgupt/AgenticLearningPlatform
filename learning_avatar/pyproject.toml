[project]
name = "learning-avatar"
version = "0.1.0"
description = "Agentic learning-app backend: Root/Teaching/Assessment agents, a real MCP content-retrieval server, FastAPI web layer."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "openai>=1.40.0",
    "mcp>=1.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    # PDF ingestion pipeline
    "docling>=2.0",
    "chonkie[st]>=0.4",
    "torch>=2.3",
    "transformers>=4.40",
    "colpali-engine>=0.3",
    "tiktoken>=0.7",
    "pillow>=10.0",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.6.0",
    "einops>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
]

[project.scripts]
learning-avatar-serve = "learning_avatar.web.main:run"
learning-avatar-mcp-server = "learning_avatar.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_avatar", "src/pdf_ingestion"]

[tool.hatch.build.targets.wheel.force-include]
"src/chunker.py" = "chunker.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
